name: CI Workflow for Docker Images

on:
  push:
    branches:
      - update1

env:
  REGISTRY: arunkumar885

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4


      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Generate Version
        id: version
        run: |
          VERSION=v1.0.${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV


      - name: Build Frontend Image
        run: |
          docker build -t $REGISTRY/frontend:frontend-prod-$VERSION ./frontend


      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/frontend:frontend-prod-$VERSION


      - name: Build Backend Image
        run: |
          docker build -t $REGISTRY/backend:backend-prod-$VERSION ./backend


      - name: Push Backend Image
        run: |
          docker push $REGISTRY/backend:backend-prod-$VERSION
